<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>买家订单详情 | MYK 管理后台</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="orders">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">MYK</div>
      <div class="admin-logo-sub">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">仪表盘</a>
        <a href="layout.html">页面布局</a>
        <a href="products.html">商品管理</a>
        <a href="categories.html">分类管理</a>
        <a href="orders.html" class="active">订单管理</a>
        <a href="languages.html">语言管理</a>
        <a href="customers.html">客户管理</a>
        <div class="view-site">
          <a href="../index.html" target="_blank">查看前台 &rarr;</a>
        </div>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:0.6rem; width:100%;" onclick="adminLogout()">退出登录</button>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <a href="orders.html" style="font-size:0.85rem; color:var(--color-text-muted);">&larr; 返回买家列表</a>
          <h1>买家订单详情</h1>
          <p>每个商品单独一行，可直接修改数量、单价（仅修正本订单）和该变体的库存，改完点"确认"保存。</p>
        </div>
      </div>

      <div class="panel">
        <div id="orderGroups"></div>
        <div class="empty-state" id="orderEmpty" style="display:none;">找不到该买家的订单。</div>
      </div>
    </main>
  </div>

  <!-- Image lightbox -->
  <div class="image-lightbox-overlay" id="imageLightbox">
    <button class="image-lightbox-close" id="imageLightboxClose" aria-label="关闭">&times;</button>
    <img id="imageLightboxImg" src="" alt="">
  </div>

  <script src="js/admin.js"></script>
  <script src="js/order-detail.js"></script>
</body>
</html>
