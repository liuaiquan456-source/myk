<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定制询单 | MYK 管理后台</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="inquiries">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">MYK</div>
      <div class="admin-logo-sub">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">仪表盘</a>
        <a href="layout.html">页面布局</a>
        <a href="products.html">商品管理</a>
        <a href="categories.html">分类管理</a>
        <a href="orders.html">订单管理</a>
        <a href="inquiries.html" class="active">定制询单</a>
        <a href="languages.html">语言管理</a>
        <a href="customers.html">客户管理</a>
        <div class="view-site">
          <a href="../index.html" target="_blank">查看前台 &rarr;</a>
        </div>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:0.6rem; width:100%;" onclick="adminLogout()">退出登录</button>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>定制询单</h1>
          <p>客户通过前台"Custom Inquiry"页面提交的定制需求</p>
        </div>
      </div>

      <div class="panel">
        <table class="data-table">
          <thead>
            <tr>
              <th>图片</th>
              <th>收件人</th>
              <th>国家 / 城市</th>
              <th>联系方式</th>
              <th>状态</th>
              <th>提交时间</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="inquiryRows"></tbody>
        </table>
        <div class="empty-state" id="inquiryEmpty" style="display:none;">暂无询单。</div>
      </div>
    </main>
  </div>

  <!-- Image lightbox -->
  <div class="image-lightbox-overlay" id="imageLightbox">
    <button class="image-lightbox-close" id="imageLightboxClose" aria-label="关闭">&times;</button>
    <img id="imageLightboxImg" src="" alt="">
  </div>

  <script src="js/admin.js"></script>
  <script src="js/inquiries.js"></script>
</body>
</html>
