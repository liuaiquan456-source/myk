<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面布局 | MYK 管理后台</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="layout">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">MYK</div>
      <div class="admin-logo-sub">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">仪表盘</a>
        <a href="layout.html" class="active">页面布局</a>
        <a href="products.html">商品管理</a>
        <a href="categories.html">分类管理</a>
        <a href="orders.html">订单管理</a>
        <a href="languages.html">语言管理</a>
        <a href="currencies.html">货币管理</a>
        <a href="customers.html">客户管理</a>
        <div class="view-site">
          <a href="../index.html" target="_blank">查看前台 &rarr;</a>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>页面布局</h1>
          <p>控制首页横幅内容，以及各板块展示的商品系列</p>
        </div>
        <button class="btn" id="saveLayoutBtn">保存更改</button>
      </div>

      <div class="panel">
        <h2>首页横幅</h2>
        <div class="form-grid">
          <div class="form-field">
            <label>小标题文字</label>
            <input type="text" id="heroEyebrow">
          </div>
          <div class="form-field">
            <label>按钮文字</label>
            <input type="text" id="heroButtonText">
          </div>
          <div class="form-field full">
            <label>主标题</label>
            <input type="text" id="heroHeading">
          </div>
          <div class="form-field full">
            <label>背景图片</label>
            <img class="image-preview" id="heroImagePreview" style="display:none;">
            <input type="file" id="heroImage" accept="image/*">
            <input type="hidden" id="heroImageUrl">
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>按分类选购</h2>
        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.88rem;">
          <input type="checkbox" id="shopByCategoryEnabled">
          在首页显示"按分类选购"板块（数据来自你的分类列表）
        </label>
      </div>

      <div class="panel">
        <h2>首页展示板块</h2>
        <p style="color:var(--color-text-muted); font-size:0.85rem; margin-bottom:1rem;">
          每个板块展示哪些商品由你在这里手动挑选和排序，与商品本身的分类无关。
        </p>
        <div id="blocksList"></div>
        <button class="btn btn-outline btn-sm" id="addBlockBtn">+ 添加板块</button>
      </div>
    </main>
  </div>

  <!-- Product picker modal -->
  <div class="modal-overlay" id="productPickerModal">
    <div class="modal">
      <button type="button" class="modal-close" id="productPickerClose" aria-label="关闭">&times;</button>
      <h2>选择商品</h2>
      <div style="display:flex; gap:0.7rem; margin-bottom:1rem;">
        <input type="text" id="productPickerSearch" placeholder="搜索商品名称或 SKU 编码…" style="flex:1; padding:0.5rem 0.7rem; border:1px solid var(--color-border); border-radius:6px; font-family:inherit;">
        <select id="productPickerCategory" style="padding:0.5rem 0.7rem; border:1px solid var(--color-border); border-radius:6px; font-family:inherit;">
          <option value="">全部分类</option>
        </select>
      </div>
      <div id="productPickerList" style="max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:0.4rem;"></div>
      <div class="form-actions">
        <button type="button" class="btn" id="productPickerConfirm">确定</button>
        <button type="button" class="btn btn-outline" id="productPickerCancel">取消</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
