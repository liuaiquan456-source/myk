<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>订单管理 | MYK 管理后台</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="orders">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">MYK</div>
      <div class="admin-logo-sub">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html">仪表盘</a>
        <a href="layout.html">页面布局</a>
        <a href="products.html">商品管理</a>
        <a href="categories.html">分类管理</a>
        <a href="orders.html" class="active">订单管理</a>
        <a href="languages.html">语言管理</a>
        <a href="currencies.html">货币管理</a>
        <a href="customers.html">客户管理</a>
        <div class="view-site">
          <a href="../index.html" target="_blank">查看前台 &rarr;</a>
        </div>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>订单管理</h1>
          <p>客户通过前台结账提交的订单，按买家汇总展示</p>
        </div>
        <button class="btn" id="exportOrdersBtn">导出订单（CSV）</button>
      </div>

      <div class="panel">
        <div class="form-field" style="max-width:280px;">
          <label>按分销商筛选</label>
          <select id="distributorFilter">
            <option value="">全部</option>
          </select>
        </div>
        <table class="data-table">
          <thead>
            <tr>
              <th></th>
              <th>买家</th>
              <th>邮箱</th>
              <th>分销商</th>
              <th>订单数</th>
              <th>消费总额</th>
              <th>最近下单时间</th>
            </tr>
          </thead>
          <tbody id="buyerRows"></tbody>
        </table>
        <div class="empty-state" id="buyerEmpty" style="display:none;">暂无订单。</div>
      </div>
    </main>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
