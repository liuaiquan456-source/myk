<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仪表盘 | MYK 管理后台</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body data-page="dashboard">
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-logo">MYK</div>
      <div class="admin-logo-sub">管理后台</div>
      <nav class="admin-nav">
        <a href="index.html" class="active">仪表盘</a>
        <a href="layout.html">页面布局</a>
        <a href="products.html">商品管理</a>
        <a href="categories.html">分类管理</a>
        <a href="orders.html">订单管理</a>
        <a href="inquiries.html">定制询单</a>
        <a href="languages.html">语言管理</a>
        <a href="customers.html">客户管理</a>
        <div class="view-site">
          <a href="../index.html" target="_blank">查看前台 &rarr;</a>
        </div>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:0.6rem; width:100%;" onclick="adminLogout()">退出登录</button>
      </nav>
    </aside>

    <main class="admin-main">
      <div class="admin-header">
        <div>
          <h1>仪表盘</h1>
          <p>店铺内容总览</p>
        </div>
      </div>

      <div class="form-grid">
        <div class="panel">
          <h2>商品</h2>
          <p style="font-size:2rem; font-weight:700;" id="statProducts">&mdash;</p>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">商品总数</p>
          <div class="form-actions">
            <a class="btn btn-sm" href="products.html">管理商品</a>
          </div>
        </div>
        <div class="panel">
          <h2>分类</h2>
          <p style="font-size:2rem; font-weight:700;" id="statCategories">&mdash;</p>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">分类总数</p>
          <div class="form-actions">
            <a class="btn btn-sm" href="categories.html">管理分类</a>
          </div>
        </div>
        <div class="panel">
          <h2>订单</h2>
          <p style="font-size:2rem; font-weight:700;" id="statOrders">&mdash;</p>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">已收到的订单数</p>
          <div class="form-actions">
            <a class="btn btn-sm" href="orders.html">查看订单</a>
          </div>
        </div>
        <div class="panel">
          <h2>账号设置</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">当前登录账号：<strong data-admin-username>&mdash;</strong></p>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">修改后台登录的账号和密码。</p>
          <div class="form-actions">
            <button type="button" class="btn btn-sm" id="openCredentialsBtn">修改账号密码</button>
          </div>
        </div>
        <div class="panel">
          <h2>首页布局</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem;">编辑首页横幅内容，并管理各板块展示的商品系列。</p>
          <div class="form-actions">
            <a class="btn btn-sm" href="layout.html">管理布局</a>
          </div>
        </div>
        <div class="panel">
          <h2>官方联系方式</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem; margin-bottom:0.8rem;">前台悬浮按钮和客户找不到分销商时使用的默认联系方式。</p>
          <div class="form-field">
            <label>WhatsApp <span style="font-weight:400; color:var(--color-text-muted);">（含国家区号，如 8613800000000）</span></label>
            <input type="text" id="contactWhatsapp" placeholder="例如：8613800000000">
          </div>
          <div class="form-field">
            <label>微信号</label>
            <input type="text" id="contactWechat" placeholder="例如：myk_official">
          </div>
          <div class="form-field">
            <label>客服邮箱</label>
            <input type="text" id="contactEmail" placeholder="例如：support@mykjewelry.com">
          </div>
          <div class="form-field">
            <label>店铺地址</label>
            <textarea id="contactAddress" rows="2" placeholder="例如：广东省深圳市罗湖区xxx路xxx号"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-sm" id="saveContactBtn">保存</button>
          </div>
        </div>
        <div class="panel full" style="grid-column: 1 / -1;">
          <h2>后台外观</h2>
          <p style="color:var(--color-text-muted); font-size:0.85rem; margin-bottom:1rem;">自定义管理后台的配色，保存后立即对所有后台页面生效（不影响前台商城的样式）。</p>
          <div class="form-grid">
            <div class="form-field">
              <label>主色 <span style="font-weight:400; color:var(--color-text-muted);">（侧边栏背景）</span></label>
              <input type="color" id="themePrimary">
            </div>
            <div class="form-field">
              <label>辅助色 <span style="font-weight:400; color:var(--color-text-muted);">（卡片、弹窗背景）</span></label>
              <input type="color" id="themeSecondary">
            </div>
            <div class="form-field">
              <label>背景色 <span style="font-weight:400; color:var(--color-text-muted);">（页面底色）</span></label>
              <input type="color" id="themeBackground">
            </div>
            <div class="form-field">
              <label>强调色 <span style="font-weight:400; color:var(--color-text-muted);">（按钮、选中状态）</span></label>
              <input type="color" id="themeAccent">
            </div>
            <div class="form-field">
              <label>文字主色</label>
              <input type="color" id="themeTextPrimary">
            </div>
            <div class="form-field">
              <label>文字次色</label>
              <input type="color" id="themeTextSecondary">
            </div>
          </div>
          <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.88rem; margin-bottom:1rem;">
            <input type="checkbox" id="themeSidebarGlass">
            侧边栏毛玻璃效果（半透明 + 模糊，主色决定底色）
          </label>
          <div class="form-actions">
            <button type="button" class="btn btn-sm" id="saveThemeBtn">保存配色</button>
            <button type="button" class="btn btn-sm btn-outline" id="resetThemeBtn">恢复默认</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Change credentials modal -->
  <div class="modal-overlay" id="credentialsModal">
    <div class="modal">
      <h2>修改账号密码</h2>
      <form id="credentialsForm">
        <div class="form-field">
          <label>当前密码 <span style="font-weight:400; color:var(--color-text-muted);">（用于验证身份，必填）</span></label>
          <div class="password-input-wrapper">
            <input type="password" id="currentPassword" required>
            <button type="button" class="password-toggle" data-target="currentPassword" aria-label="显示密码"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
          </div>
        </div>
        <div class="form-field">
          <label>新密码 <span style="font-weight:400; color:var(--color-text-muted);">（选填，留空则不修改，至少 6 位）</span></label>
          <div class="password-input-wrapper">
            <input type="password" id="newPassword">
            <button type="button" class="password-toggle" data-target="newPassword" aria-label="显示密码"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
          </div>
        </div>
        <p id="credentialsError" style="color:var(--color-danger); font-size:0.85rem; min-height:1.2em;"></p>
        <div class="form-actions">
          <button type="submit" class="btn">保存</button>
          <button type="button" class="btn btn-outline" id="credentialsCancelBtn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script>
    (async () => {
      const [products, categories, orders] = await Promise.all([
        api('/api/products'),
        api('/api/categories'),
        api('/api/orders'),
      ]);
      document.getElementById('statProducts').textContent = products.length;
      document.getElementById('statCategories').textContent = categories.length;
      document.getElementById('statOrders').textContent = orders.length;
    })();

    (async () => {
      const layout = await api('/api/layout');
      document.getElementById('contactWhatsapp').value = layout.contactWhatsapp || '';
      document.getElementById('contactWechat').value = layout.contactWechat || '';
      document.getElementById('contactEmail').value = layout.contactEmail || '';
      document.getElementById('contactAddress').value = layout.contactAddress || '';
    })();

    document.getElementById('saveContactBtn').addEventListener('click', async () => {
      try {
        // PUT /api/layout replaces the whole object, so fetch the current one
        // first and only touch these fields — otherwise this would wipe out
        // the hero/blocks settings managed on the Layout page.
        const layout = await api('/api/layout');
        layout.contactWhatsapp = document.getElementById('contactWhatsapp').value.trim();
        layout.contactWechat = document.getElementById('contactWechat').value.trim();
        layout.contactEmail = document.getElementById('contactEmail').value.trim();
        layout.contactAddress = document.getElementById('contactAddress').value.trim();
        await api('/api/layout', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(layout),
        });
        showToast('联系方式已保存');
      } catch (err) {
        showToast(err.message);
      }
    });

    // ---------- Admin theme ----------
    // Matches server/db.js's DEFAULT_ADMIN_THEME — used by "恢复默认" since
    // that's the built-in look, not something the API needs to expose.
    // applyAdminTheme/hexToRgba/ADMIN_THEME_CACHE_KEY come from js/admin.js.
    const DEFAULT_ADMIN_THEME = {
      primary: '#ffffff',
      secondary: '#ffffff',
      background: '#faf8f5',
      textPrimary: '#1c1a17',
      textSecondary: '#6b6459',
      accent: '#1c1a17',
      sidebarGlass: false,
    };

    const themeColorFields = {
      primary: document.getElementById('themePrimary'),
      secondary: document.getElementById('themeSecondary'),
      background: document.getElementById('themeBackground'),
      textPrimary: document.getElementById('themeTextPrimary'),
      textSecondary: document.getElementById('themeTextSecondary'),
      accent: document.getElementById('themeAccent'),
    };
    const themeSidebarGlassField = document.getElementById('themeSidebarGlass');

    function fillThemeFields(theme) {
      Object.entries(themeColorFields).forEach(([key, input]) => {
        input.value = theme[key];
      });
      themeSidebarGlassField.checked = !!theme.sidebarGlass;
    }

    function readThemeFields() {
      const theme = Object.fromEntries(Object.entries(themeColorFields).map(([key, input]) => [key, input.value]));
      theme.sidebarGlass = themeSidebarGlassField.checked;
      return theme;
    }

    async function saveTheme(theme) {
      await api('/api/admin-theme', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(theme),
      });
      applyAdminTheme(theme);
      localStorage.setItem(ADMIN_THEME_CACHE_KEY, JSON.stringify(theme));
    }

    (async () => {
      const theme = await api('/api/admin-theme');
      fillThemeFields(theme);
    })();

    document.getElementById('saveThemeBtn').addEventListener('click', async () => {
      try {
        await saveTheme(readThemeFields());
        showToast('配色已保存');
      } catch (err) {
        showToast(err.message);
      }
    });

    document.getElementById('resetThemeBtn').addEventListener('click', async () => {
      fillThemeFields(DEFAULT_ADMIN_THEME);
      try {
        await saveTheme(DEFAULT_ADMIN_THEME);
        showToast('已恢复默认配色');
      } catch (err) {
        showToast(err.message);
      }
    });

    const credentialsModal = document.getElementById('credentialsModal');
    const credentialsForm = document.getElementById('credentialsForm');

    document.getElementById('openCredentialsBtn').addEventListener('click', () => {
      credentialsForm.reset();
      document.getElementById('credentialsError').textContent = '';
      credentialsModal.classList.add('open');
    });
    document.getElementById('credentialsCancelBtn').addEventListener('click', () => {
      credentialsModal.classList.remove('open');
    });

    document.querySelectorAll('#credentialsForm .password-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        input.type = input.type === 'password' ? 'text' : 'password';
      });
    });

    credentialsForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('credentialsError');
      errorEl.textContent = '';
      try {
        await api('/api/admin/credentials', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            currentPassword: document.getElementById('currentPassword').value,
            newPassword: document.getElementById('newPassword').value,
          }),
        });
        showToast('密码已更新');
        credentialsModal.classList.remove('open');
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
