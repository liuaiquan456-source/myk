<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 | MYK 管理后台</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--color-bg);">
    <div class="panel" style="width:100%; max-width:360px;">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <div style="font-weight:700; font-size:1.4rem; letter-spacing:0.05em;">MYK</div>
        <div style="color:var(--color-text-muted); font-size:0.85rem;">管理后台登录</div>
      </div>
      <form id="loginForm">
        <div class="form-field">
          <label>账号</label>
          <input type="text" id="loginUsername" required autofocus>
        </div>
        <div class="form-field">
          <label>密码</label>
          <input type="password" id="loginPassword" required>
        </div>
        <p id="loginError" style="color:var(--color-danger); font-size:0.85rem; min-height:1.2em; margin-bottom:0.5rem;"></p>
        <div class="form-actions" style="justify-content:stretch;">
          <button type="submit" class="btn" style="width:100%;">登录</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('loginError');
      errorEl.textContent = '';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('loginUsername').value.trim(),
            password: document.getElementById('loginPassword').value,
          }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || '登录失败');
        }
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || 'index.html';
      } catch (err) {
        errorEl.textContent = err.message;
      }
    });
  </script>
</body>
</html>
